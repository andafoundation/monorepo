name: Website CI

# Checks the site on pull requests and on main. The job uses no secret, so a pull request
# from a fork runs it as well. Public actions are pinned by full commit SHA.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/website/**'
      - '.github/workflows/website-ci.yml'

# Test-only: nothing is deployed here, so a superseded run can be cancelled on any branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/website
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pin Bun to the version that wrote bun.lock (lockfileVersion 3) instead of floating on latest.
          bun-version: '1.4.3'

      # The download store only, never node_modules; saved on main so every branch can read it.
      - name: Restore Bun dependencies
        id: bun-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-buninstall-projects/website-${{ hashFiles('projects/website/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-buninstall-projects/website-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Save Bun dependencies
        if: github.ref_name == 'main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-buninstall-projects/website-${{ hashFiles('projects/website/bun.lock') }}

      - name: Type check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
